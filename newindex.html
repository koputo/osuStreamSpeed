    <div class="form-group form-check text-center mb-3">

    <div id="numClicks" class="form-group">

      <input id = "clickNum" type="number" min="3" class="form-control text-center" style="width:150px; display:inline-block;"/>
    </div>
    <div id="timeClicks" class="form-group" style="display:none">

    </div>

    <div class="form-group" style="width:150px; margin: 0 auto 10px auto;">
        <label for="key1">Key 1</label>

    <div class="form-group" style="width:150px; margin: 0 auto 15px auto;">
        <label for="key2">Key 2</label>

    <button id="submit" onclick = "beginTest()" type="button" class="btn btn-lg btn-success mb-2">Begin Test</button><br />
    <button id="stopbtn" onClick="endTest()" type="button" class="btn btn-lg btn-danger mb-3" style="display:none">Stop Test</button><br />
